[workspace]
resolver = "2"
members = [
  "crates/branchly-core",
  "apps/client/src-tauri",
  "services/sync-server",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Proprietary"
rust-version = "1.81"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }
