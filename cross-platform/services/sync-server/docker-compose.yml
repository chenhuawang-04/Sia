services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: branchly
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: branchly
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branchly"]
      interval: 5s
      timeout: 3s
      retries: 10
  sync:
    build:
      context: ../../..
      dockerfile: cross-platform/services/sync-server/Dockerfile
    environment:
      DATABASE_URL: postgres://branchly:local-development-only@postgres/branchly
      JWT_SECRET: local-development-secret-change-before-production
      OBJECT_STORE: local
      OBJECT_STORE_PATH: /data/objects
    ports: ["8080:8080"]
    volumes:
      - object-data:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  object-data:
