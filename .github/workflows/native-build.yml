name: Native Builds
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        working-directory: cross-platform/apps/client
        run: npm install --no-save @tauri-apps/cli@2.11.4
      - name: Generate platform icon set
        working-directory: cross-platform/apps/client
        run: npx tauri icon src-tauri/icons/branchly.svg --output src-tauri/icons
      - name: Verify locked Rust dependency graph
        run: cargo metadata --locked --manifest-path cross-platform/Cargo.toml --no-deps
      - name: Build unsigned Windows bundles
        working-directory: cross-platform/apps/client
        run: npx tauri build
      - name: Smoke-launch Windows application
        shell: pwsh
        run: |
          $executable = Resolve-Path "cross-platform/target/release/branchly-client.exe"
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 12
            if ($process.HasExited) {
              throw "Branchly exited during the Windows startup smoke test with code $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: branchly-windows-unsigned
          path: cross-platform/target/release/bundle/**
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install Android NDK and Tauri CLI
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          cd cross-platform/apps/client
          npm install --no-save @tauri-apps/cli@2.11.4
      - name: Initialize and build unsigned Android APK
        working-directory: cross-platform/apps/client
        run: |
          npx tauri icon src-tauri/icons/branchly.svg --output src-tauri/icons
          npx tauri android init
          cargo metadata --locked --manifest-path ../../Cargo.toml --no-deps
          npx tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: branchly-android-unsigned
          path: cross-platform/apps/client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: branchly-android-unsigned
          path: artifacts/android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install and launch APK on Android 9 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            test -n "$(find artifacts/android -type f -name '*.apk' -print -quit)"
            "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$(find artifacts/android -type f -name '*.apk' -print -quit)" | grep -F "package: name='io.branchly.mindmap'"
            keytool -genkeypair -keystore /tmp/branchly-ci-debug.keystore -storepass android -keypass android -alias branchly-ci -dname "CN=Branchly CI,O=Branchly,C=CN" -keyalg RSA -validity 1
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks /tmp/branchly-ci-debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias branchly-ci "$(find artifacts/android -type f -name '*.apk' -print -quit)"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$(find artifacts/android -type f -name '*.apk' -print -quit)"
            timeout 240 adb install -r "$(find artifacts/android -type f -name '*.apk' -print -quit)" || { echo "Streamed APK install stalled; restarting ADB and retrying without streaming"; adb kill-server || true; adb start-server; timeout 90 adb wait-for-device; timeout 360 adb install --no-streaming -r "$(find artifacts/android -type f -name '*.apk' -print -quit)"; }
            adb shell monkey -p io.branchly.mindmap -c android.intent.category.LAUNCHER 1
            sleep 12
            test -n "$(adb shell pidof io.branchly.mindmap | tr -d '\r')"
