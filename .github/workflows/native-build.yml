name: Native Builds
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2.11.4
      - name: Generate platform icon set
        working-directory: cross-platform/apps/client
        run: tauri icon src-tauri/icons/branchly.svg --output src-tauri/icons
      - name: Build unsigned Windows bundles
        working-directory: cross-platform/apps/client
        run: tauri build -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: branchly-windows-unsigned
          path: cross-platform/target/release/bundle/**
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install Android NDK and Tauri CLI
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          npm install --global @tauri-apps/cli@2.11.4
      - name: Initialize and build unsigned Android APK
        working-directory: cross-platform/apps/client
        run: |
          tauri icon src-tauri/icons/branchly.svg --output src-tauri/icons
          tauri android init
          tauri android build --apk -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: branchly-android-unsigned
          path: cross-platform/apps/client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
