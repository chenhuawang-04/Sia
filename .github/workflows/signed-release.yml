name: Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the application version
        required: true
        default: v2.1.0

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_PUBLIC_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_PUBLIC_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release version
        shell: pwsh
        run: |
          $config = Get-Content "cross-platform/apps/client/src-tauri/tauri.conf.json" | ConvertFrom-Json
          if ($env:RELEASE_TAG -ne "v$($config.version)") {
            throw "Release tag $env:RELEASE_TAG does not match application version $($config.version)"
          }
      - name: Install pinned Tauri CLI
        working-directory: cross-platform/apps/client
        run: npm install --no-save @tauri-apps/cli@2.11.4
      - name: Import Authenticode certificate
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "branchly-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable
          if (-not $certificate.HasPrivateKey) { throw "Imported Windows certificate has no private key" }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build signed Windows release bundles
        working-directory: cross-platform/apps/client
        shell: pwsh
        run: |
          npx tauri icon src-tauri/icons/branchly.svg --output src-tauri/icons
          cargo metadata --locked --manifest-path ../../Cargo.toml --no-deps
          $override = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Compress -Depth 5
          npx tauri build --config $override
      - name: Verify and stage Windows signatures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $files = @(Get-ChildItem "cross-platform/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in ".exe", ".msi" } | ForEach-Object { $_.FullName })
          if ($files.Count -lt 2) { throw "Expected both signed MSI and NSIS Windows installers" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if (-not $signature.SignerCertificate) { throw "Missing Authenticode signature: $file" }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Unexpected signing certificate on $file"
            }
          }
          Get-ChildItem "cross-platform/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in ".exe", ".msi" } | Copy-Item -Destination release-assets
          [IO.File]::WriteAllBytes("release-assets/Branchly-self-signed-release.cer", [Convert]::FromBase64String($env:WINDOWS_PUBLIC_CERTIFICATE_BASE64))
      - name: Smoke-launch signed Windows application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path "cross-platform/target/release/branchly-client.exe") -PassThru
          try {
            Start-Sleep -Seconds 12
            if ($process.HasExited) { throw "Signed Branchly executable exited with code $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: branchly-windows-signed-release
          path: release-assets/*
          if-no-files-found: error

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Validate release version
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./cross-platform/apps/client/src-tauri/tauri.conf.json').version")"
      - name: Install Android toolchain and pinned Tauri CLI
        run: |
          sdkmanager "ndk;27.0.12077973" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          cd cross-platform/apps/client
          npm install --no-save @tauri-apps/cli@2.11.4
      - name: Build optimized Android release APK
        working-directory: cross-platform/apps/client
        run: |
          npx tauri icon src-tauri/icons/branchly.svg --output src-tauri/icons
          npx tauri android init
          cargo metadata --locked --manifest-path ../../Cargo.toml --no-deps
          npx tauri android build --apk
      - name: Sign and verify Android release APK
        run: |
          mkdir -p release-assets
          base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/branchly-release.jks"
          unsigned_apk=$(find cross-platform/apps/client/src-tauri/gen/android/app/build/outputs/apk -type f -name '*-unsigned.apk' -print -quit)
          test -n "$unsigned_apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$unsigned_apk" "$RUNNER_TEMP/branchly-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/branchly-release.jks" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --ks-key-alias "$ANDROID_KEY_ALIAS" --out "release-assets/Branchly-$RELEASE_TAG-android.apk" "$RUNNER_TEMP/branchly-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release-assets/Branchly-$RELEASE_TAG-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: branchly-android-signed-release
          path: release-assets/*.apk
          if-no-files-found: error

  android-release-smoke:
    needs: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: branchly-android-signed-release
          path: release-assets
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install and launch signed APK on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            test -n "$(find release-assets -type f -name '*.apk' -print -quit)"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$(find release-assets -type f -name '*.apk' -print -quit)"
            adb install -r "$(find release-assets -type f -name '*.apk' -print -quit)"
            adb shell monkey -p io.branchly.mindmap -c android.intent.category.LAUNCHER 1
            sleep 12
            test -n "$(adb shell pidof io.branchly.mindmap | tr -d '\r')"

  publish:
    needs: [windows-release, android-release, android-release-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: branchly-*-signed-release
          path: release-assets
          merge-multiple: true
      - name: Generate release checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish signed GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Branchly ${{ inputs.tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            Branchly 的首个 Windows + Android 签名 release。

            - Android APK：使用项目 release keystore 签名，并在 Android 9 模拟器完成安装和启动验证。
            - Windows 安装包：使用 Authenticode 代码签名并完成启动验证。当前证书为项目自签名证书，不具备商业 CA 的公共信任链，因此 Windows SmartScreen 仍可能显示“未知发布者”或信誉警告。
            - `Branchly-self-signed-release.cer` 是 Windows 签名公钥证书，仅供核对签名指纹或在明确理解风险后手动导入。
            - 所有资产的 SHA-256 位于 `SHA256SUMS.txt`。
          files: release-assets/*
          fail_on_unmatched_files: true
